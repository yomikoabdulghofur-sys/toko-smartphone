<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Atur Ulang Kata Sandi – Toko Seluler</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .pwbox { position: relative; }
    .pwbox input { width: 100%; padding-right: 84px; box-sizing: border-box; }
    .pwbox button {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: 0; color: #94a3b8; cursor: pointer;
      font-size: 14px; padding: 6px 8px;
    }
    .pwbox button:hover { color: #fff; }
  </style>
</head>
<body class="auth">
  <form id="f">
    <h1>Kata sandi baru</h1>
    <p>Masukkan kata sandi baru untuk akun Anda.</p>
    <div class="pwbox">
      <input id="pw" type="password" placeholder="Kata sandi baru (min. 8 karakter)" autocomplete="new-password" minlength="8" required>
      <button type="button" id="eye" aria-label="Tampilkan kata sandi">Lihat</button>
    </div>
    <button class="btn" id="go">Simpan</button>
    <div class="msg" id="m" role="alert"></div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    const $ = (i) => document.getElementById(i);

    $('eye').onclick = () => {
      const show = $('pw').type === 'password';
      $('pw').type = show ? 'text' : 'password';
      $('eye').textContent = show ? 'Sembunyi' : 'Lihat';
      $('eye').setAttribute('aria-label', show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
    };

    $('f').onsubmit = async (e) => {
      e.preventDefault();
      const m = $('m');
      m.className = 'msg';
      m.textContent = '';
      $('go').disabled = true;

      const { error } = await sb.auth.updateUser({ password: $('pw').value });
      $('go').disabled = false;

      if (error) { m.textContent = 'Gagal: ' + error.message + ' (buka ulang tautan dari email Anda jika sudah kedaluwarsa).'; return; }

      m.className = 'msg ok';
      m.textContent = 'Kata sandi diperbarui. Mengalihkan ke halaman masuk…';
      await sb.auth.signOut();
      setTimeout(() => location.replace('login.html'), 1500);
    };
  </script>
</body>
</html>
